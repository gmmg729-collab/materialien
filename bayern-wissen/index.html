<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Das weiß ich schon über Bayern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1d1f; --paper:#fffdf8; --line:#2b2b2b; --muted:#6b6b6b;
    --blue:#1f6fbf; --blue-l:#e6f0fb; --blue-m:#b9d4f1;
    --ok:#2e8b57; --ok-l:#e5f4ea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f6;color:var(--ink);font-family:"Andika",system-ui,sans-serif;font-size:17px;line-height:1.4}
  .sheet{max-width:1100px;margin:18px auto;background:var(--paper);border-radius:18px;padding:22px 26px 30px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  header{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .title{font-family:"Fredoka",sans-serif;font-weight:700;font-size:30px;background:#e4e4e4;border:2px solid var(--line);border-radius:16px;padding:8px 22px;line-height:1.15}
  .name{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 12px}
  .name label{font-weight:700}
  .name input{flex:1;border:none;background:transparent;font:inherit;font-size:19px;outline:none;min-width:80px}
  .progress{font-family:"Fredoka";font-weight:600;background:var(--blue-l);color:var(--blue);border-radius:999px;padding:8px 16px;white-space:nowrap}
  .task{margin:14px 0 18px;font-size:17px}
  .task b{font-family:"Fredoka"}

  .grid{display:grid;grid-template-columns:1fr 1.25fr 1fr;grid-template-rows:auto auto auto;gap:18px}
  .box{position:relative;border:2px solid var(--line);border-radius:14px;background:#fff;min-height:190px;padding:12px 14px 40px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .15s, box-shadow .15s, border-color .15s;display:flex;flex-direction:column}
  .box:hover,.box:focus-visible{transform:translateY(-3px);box-shadow:0 6px 18px rgba(31,111,191,.18);border-color:var(--blue);outline:none}
  .box h2{font-family:"Fredoka";font-weight:600;font-size:19px;margin:0 0 8px;line-height:1.2}
  .box h2 small{display:block;font-family:"Andika";font-weight:400;font-size:13px;color:var(--muted)}
  .box .deco{position:absolute;right:10px;bottom:6px;font-size:34px;opacity:.9;pointer-events:none}
  .box .hint{color:var(--muted);font-size:15px;margin-top:auto;margin-bottom:auto;display:flex;align-items:center;gap:6px}
  .box ul{margin:0;padding:0;list-style:none}
  .box li{padding:4px 0 4px 0;border-bottom:1px dashed #cfcfcf;font-size:16.5px;display:flex;gap:8px;align-items:flex-start}
  .box li:last-child{border-bottom:none}
  .box.done{border-color:var(--ok);background:linear-gradient(#fff,#fbfefc)}
  .box .badge{position:absolute;top:-11px;right:12px;background:var(--ok);color:#fff;font-family:"Fredoka";font-size:13px;padding:2px 10px;border-radius:999px}
  .box .badge.part{background:#e0a100}

  .mapcell{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;padding:4px}
  .mapcell svg{width:100%;max-width:420px;height:auto}
  .land{fill:url(#rauten);stroke:var(--line);stroke-width:2.2;stroke-linejoin:round}
  .maplabel{font-family:"Fredoka";font-weight:700;font-size:34px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:7px}
  .city{fill:var(--ink)}
  .citylabel{font-family:"Andika";font-size:13px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px}

  /* Dialog */
  .overlay{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .overlay.open{display:flex}
  .dialog{background:var(--paper);border-radius:18px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .dhead .icon{font-size:38px}
  .dhead h3{font-family:"Fredoka";font-size:24px;margin:0;flex:1}
  .close{border:none;background:#eee;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
  .dsub{color:var(--muted);margin:0 0 14px}
  .counter{font-family:"Fredoka";font-weight:600;color:var(--blue)}
  .options{display:grid;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid #d6d6d6;border-radius:14px;background:#fff;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;transition:border-color .12s, background .12s}
  .opt:hover{border-color:var(--blue-m)}
  .opt .em{font-size:30px;line-height:1;flex:0 0 38px;text-align:center}
  .opt .txt{flex:1}
  .opt .t{font-family:"Fredoka";font-weight:600;font-size:18px}
  .opt .d{font-size:15.5px;color:#333;margin-top:2px}
  .opt .chk{flex:0 0 30px;height:30px;border:2px solid #bbb;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;margin-top:2px}
  .opt.sel{border-color:var(--blue);background:var(--blue-l)}
  .opt.sel .chk{background:var(--blue);border-color:var(--blue)}
  .opt.dim{opacity:.5}
  .dfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn{font-family:"Fredoka";font-weight:600;font-size:17px;border:none;border-radius:12px;padding:10px 20px;cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.primary:disabled{background:#a9c3df;cursor:not-allowed}
  .btn.ghost{background:#eee;color:#333}
  .msg{color:#b55400;font-size:15px;min-height:1.2em}

  .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;flex-wrap:wrap}
  .finish{display:none;background:var(--ok-l);border:2px solid var(--ok);border-radius:14px;padding:10px 16px;font-family:"Fredoka";font-weight:600;color:var(--ok)}
  .finish.show{display:block}

  /* positions */
  #f-essen{grid-column:1;grid-row:1}
  #f-sehens{grid-column:2;grid-row:1}
  #f-staedte{grid-column:3;grid-row:1}
  #f-tiere{grid-column:1;grid-row:2;margin-right:10px}
  #f-produkte{grid-column:3;grid-row:2;margin-left:10px}
  #f-land{grid-column:1;grid-row:3}
  #f-trad{grid-column:2;grid-row:3}
  #f-sport{grid-column:3;grid-row:3}

  @media (max-width:820px){
    .sheet{margin:0;border-radius:0;padding:16px}
    .grid{grid-template-columns:1fr 1fr}
    .grid > *{grid-column:auto !important;grid-row:auto !important;margin:0 !important}
    .mapcell{grid-column:1 / -1 !important;order:-1}
    .title{font-size:24px}
  }
  @media (max-width:520px){
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="title">Das weiß ich schon über Bayern</div>
    <div class="name"><label for="name">Name:</label><input id="name" autocomplete="off"></div>
    <div class="progress" id="progress">0 von 8 Feldern</div>
  </header>
  <p class="task"><b>1.</b> Tippe auf ein Kästchen. Du bekommst 5 Vorschläge mit kurzen Infos. Lies sie durch und <b>wähle 3 Begriffe</b> aus, die gut in das Kästchen passen. Schreibe sie dann auf dein Arbeitsblatt.</p>

  <div class="grid" id="grid">
    <div class="mapcell" aria-hidden="true">
      <svg viewBox="0 0 420 430" id="map">
        <defs>
          <pattern id="rauten" width="22" height="38" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
            <rect width="22" height="38" fill="#ffffff"/>
            <path d="M11 0 L22 19 L11 38 L0 19 Z" fill="#e3eefa"/>
          </pattern>
        </defs>
        <path class="land" id="landpath"/>
        <g id="cities"></g>
        <text class="maplabel" x="200" y="245" text-anchor="middle">BAYERN</text>
      </svg>
    </div>
  </div>

  <div class="bottom">
    <div class="finish" id="finish">🎉 Super! Du hast alle 8 Felder ausgefüllt.</div>
    <button class="btn ghost" id="reset">Alles zurücksetzen</button>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dtitle">
  <div class="dialog">
    <div class="dhead"><span class="icon" id="dicon"></span><h3 id="dtitle"></h3><button class="close" id="dclose" aria-label="Schließen">✕</button></div>
    <p class="dsub">Wähle <b>3</b> Begriffe aus. <span class="counter" id="dcount"></span></p>
    <div class="options" id="dopts"></div>
    <div class="dfoot">
      <span class="msg" id="dmsg"></span>
      <button class="btn primary" id="dok">Fertig ✓</button>
    </div>
  </div>
</div>

<script>
const FIELDS = [
  {id:"essen", title:"Essen und Trinken", icon:"🥨", deco:"🍺", items:[
    ["🥨","Brezn","Die Brezn ist ein Laugengebäck mit grobem Salz. In Bayern isst man sie gern zur Brotzeit."],
    ["🌭","Weißwurst","Die Weißwurst kommt aus München und wird aus Kalbfleisch gemacht. Man isst sie mit süßem Senf und Brezn."],
    ["🍖","Schweinebraten mit Knödeln","Das ist ein typisches Sonntagsessen in Bayern. Dazu gibt es Soße und oft Krautsalat."],
    ["🧀","Obatzda","Obatzda ist eine Käsecreme aus Camembert, Butter und Paprikapulver. Man streicht ihn auf Brot oder Brezn."],
    ["🥤","Spezi","Spezi ist eine Mischung aus Cola und Orangenlimonade. Sie wurde 1956 in Augsburg erfunden."]
  ]},
  {id:"sehens", title:"Bekannte Sehenswürdigkeiten", icon:"🏰", deco:"🏛️", items:[
    ["🏰","Schloss Neuschwanstein","König Ludwig II. ließ dieses Märchenschloss bauen. Jedes Jahr besuchen es über eine Million Menschen."],
    ["⛪","Frauenkirche in München","Ihre zwei Türme mit den runden Hauben sind das Wahrzeichen von München. Die Kirche ist über 500 Jahre alt."],
    ["🏯","Kaiserburg in Nürnberg","Die Burg steht hoch über der Altstadt von Nürnberg. Früher wohnten dort Kaiser und Könige."],
    ["👑","Residenz in Würzburg","Die Residenz ist ein riesiges Schloss mit prächtigen Sälen. Sie gehört zum UNESCO-Welterbe."],
    ["🌉","Steinerne Brücke in Regensburg","Die Brücke führt über die Donau und ist fast 900 Jahre alt. Sie ist eine der ältesten Brücken Deutschlands."]
  ]},
  {id:"staedte", title:"Bekannte Städte", icon:"🏙️", deco:"🏘️", items:[
    ["🏙️","München","München ist die Landeshauptstadt von Bayern. Hier leben etwa 1,5 Millionen Menschen."],
    ["🎄","Nürnberg","Nürnberg ist die zweitgrößte Stadt in Bayern. Bekannt sind der Christkindlesmarkt und die Lebkuchen."],
    ["🏛️","Augsburg","Augsburg wurde vor über 2000 Jahren von den Römern gegründet. Hier gibt es die berühmte Augsburger Puppenkiste."],
    ["⛵","Regensburg","Regensburg liegt an der Donau. Die Altstadt gehört zum UNESCO-Welterbe."],
    ["🌊","Passau","Passau nennt man die Dreiflüssestadt. Hier fließen Donau, Inn und Ilz zusammen."]
  ]},
  {id:"tiere", title:"Tier- und Pflanzenwelt", icon:"🦌", deco:"🌼", items:[
    ["🌼","Edelweiß","Das Edelweiß wächst hoch oben in den Alpen. Es steht unter Naturschutz und darf nicht gepflückt werden."],
    ["💙","Enzian","Der Enzian hat leuchtend blaue Blüten. Er wächst auf Bergwiesen in den Alpen."],
    ["🐐","Gämse","Die Gämse ist eine geschickte Kletterin in den Bergen. Sie findet sogar an steilen Felsen Halt."],
    ["🐿️","Murmeltier","Murmeltiere leben in den Alpen in Höhlen unter der Erde. Bei Gefahr warnen sie die anderen mit einem lauten Pfiff."],
    ["🐱","Luchs","Der Luchs ist eine Wildkatze mit Pinselohren. Im Bayerischen Wald lebt er wieder in Freiheit."]
  ]},
  {id:"produkte", title:"Typisch bayrische Produkte", icon:"🚗", deco:"🧀", items:[
    ["🚗","Autos (BMW und Audi)","BMW baut Autos in München, Audi in Ingolstadt. Sie werden in die ganze Welt verkauft."],
    ["🥬","Spargel","Rund um Schrobenhausen und Abensberg wächst viel weißer Spargel. Geerntet wird er im Frühling."],
    ["🧀","Käse aus dem Allgäu","Im Allgäu weiden viele Kühe auf grünen Wiesen. Aus ihrer Milch macht man zum Beispiel Bergkäse und Emmentaler."],
    ["🌿","Hopfen","In der Hallertau wächst so viel Hopfen wie fast nirgends sonst auf der Welt. Man braucht ihn zum Bierbrauen."],
    ["🧸","Playmobil","Die Playmobil-Figuren wurden in Zirndorf bei Nürnberg erfunden. Dort gibt es auch einen großen Freizeitpark."]
  ]},
  {id:"land", title:"Landschaften", sub:"(Berge, Seen, Flüsse)", icon:"⛰️", deco:"🏔️", items:[
    ["🏔️","Zugspitze","Mit 2962 Metern ist sie der höchste Berg Deutschlands. Auf den Gipfel fährt eine Seilbahn."],
    ["🏝️","Chiemsee","Der Chiemsee ist der größte See in Bayern. Man nennt ihn auch das „Bayerische Meer“."],
    ["🛶","Königssee","Der Königssee liegt bei Berchtesgaden zwischen steilen Bergen. Sein Wasser ist besonders sauber und klar."],
    ["🌊","Donau","Die Donau ist der längste Fluss in Bayern. Sie fließt durch Regensburg und Passau bis ins Schwarze Meer."],
    ["🌲","Bayerischer Wald","Das ist ein großes Waldgebirge an der Grenze zu Tschechien. Dort liegt der älteste Nationalpark Deutschlands."]
  ]},
  {id:"trad", title:"Traditionen und Brauchtum", icon:"🪗", deco:"🪗", items:[
    ["🎡","Oktoberfest","Das Oktoberfest in München ist das größte Volksfest der Welt. Es wird seit 1810 gefeiert."],
    ["👗","Tracht: Dirndl und Lederhose","Bei Festen tragen viele Menschen Tracht. Frauen tragen oft ein Dirndl, Männer eine Lederhose."],
    ["🌳","Maibaum","Am 1. Mai wird in vielen Dörfern ein geschmückter Maibaum aufgestellt. Manchmal versuchen Nachbardörfer, ihn vorher zu stehlen."],
    ["🎄","Christkindlesmarkt","Der Nürnberger Christkindlesmarkt ist einer der bekanntesten Weihnachtsmärkte. Eröffnet wird er vom Nürnberger Christkind."],
    ["💃","Schuhplattler und Blasmusik","Beim Schuhplattler schlagen Tänzer im Takt auf Schuhe und Lederhose. Dazu spielt oft eine Blaskapelle."]
  ]},
  {id:"sport", title:"Sport und Freizeit", icon:"⚽", deco:"🥾", items:[
    ["⚽","FC Bayern München","Der FC Bayern ist der erfolgreichste Fußballverein Deutschlands. Er spielt in der Allianz Arena."],
    ["⛷️","Skifahren","Im Winter kann man in den bayerischen Alpen Ski fahren. Bekannt dafür ist Garmisch-Partenkirchen."],
    ["🥾","Wandern","Auf vielen Wegen kann man durch Berge und Wälder wandern. Oben wartet oft eine Berghütte."],
    ["🏊","Baden und Bootfahren","Im Sommer kann man in vielen bayerischen Seen schwimmen. Man kann auch Tretboot oder Segelboot fahren."],
    ["🥌","Eisstockschießen","Dabei schiebt man einen Eisstock über das Eis zu einem Ziel. Das ist ein alter Wintersport in Bayern."]
  ]}
];

/* ---------- Karte (Umriss aus Längen-/Breitengraden) ---------- */
const OUTLINE = [[9.03,50.05],[9.25,50.15],[9.5,50.24],[9.75,50.42],[10.04,50.53],[10.25,50.47],[10.6,50.33],[10.85,50.38],[11.05,50.43],[11.25,50.48],[11.45,50.4],[11.65,50.42],[11.9,50.45],[12.1,50.32],[12.25,50.27],[12.15,50.12],[12.35,50.08],[12.5,49.97],[12.45,49.8],[12.5,49.68],[12.65,49.48],[12.85,49.35],[13.05,49.26],[13.25,49.12],[13.45,49.02],[13.6,48.92],[13.82,48.77],[13.72,48.62],[13.48,48.56],[13.42,48.42],[13.15,48.3],[12.9,48.2],[12.78,48.05],[12.98,47.93],[12.95,47.73],[13.08,47.66],[13.02,47.47],[12.8,47.58],[12.65,47.68],[12.45,47.68],[12.22,47.62],[12.05,47.62],[11.75,47.58],[11.45,47.5],[11.2,47.41],[10.98,47.4],[10.75,47.47],[10.5,47.55],[10.38,47.38],[10.2,47.27],[10.1,47.4],[9.97,47.54],[9.78,47.59],[9.6,47.53],[9.85,47.75],[10.07,47.9],[10.1,48.15],[10.15,48.45],[10.3,48.62],[10.45,48.83],[10.43,49.03],[10.25,49.18],[10.12,49.37],[10.08,49.55],[9.92,49.6],[9.85,49.75],[9.6,49.68],[9.35,49.65],[9.1,49.58],[9.08,49.75],[9.0,49.9]];
const LON0=8.85, LAT0=50.65, KX=77, KY=118;
const P = ([lon,lat]) => [(lon-LON0)*KX, (LAT0-lat)*KY];
(function drawMap(){
  const pts = OUTLINE.map(P);
  // weiche Kurve (Catmull-Rom)
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length;i++){
    const p0=pts[(i-1+pts.length)%pts.length], p1=pts[i], p2=pts[(i+1)%pts.length], p3=pts[(i+2)%pts.length];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  document.getElementById('landpath').setAttribute('d', d+'Z');
  const cities=[["München",11.58,48.14,1],["Nürnberg",11.08,49.45,1],["Augsburg",10.9,48.37,1],["Regensburg",12.1,49.02,1],["Würzburg",9.93,49.79,1],["Passau",13.43,48.57,-1]];
  const g=document.getElementById('cities');
  g.innerHTML = cities.map(([n,lon,lat,side])=>{const [x,y]=P([lon,lat]);
    return `<circle class="city" cx="${x}" cy="${y}" r="4"/><text class="citylabel" x="${x+(side>0?7:-7)}" y="${y+4}" text-anchor="${side>0?'start':'end'}">${n}</text>`}).join('');
})();

/* ---------- Zustand ---------- */
let state = {};
try{ state = JSON.parse(localStorage.getItem('bayern-ws')||'{}') || {}; }catch(e){ state={}; }
state.sel = state.sel || {};
function save(){ try{ localStorage.setItem('bayern-ws', JSON.stringify(state)); }catch(e){} }

const nameInput=document.getElementById('name');
nameInput.value = state.name||'';
nameInput.addEventListener('input',()=>{state.name=nameInput.value;save();});

/* ---------- Kästchen ---------- */
const grid=document.getElementById('grid');
FIELDS.forEach(f=>{
  const b=document.createElement('button');
  b.className='box'; b.id='f-'+f.id; b.type='button';
  b.addEventListener('click',()=>openDialog(f.id));
  grid.appendChild(b);
});
function renderBoxes(){
  let done=0;
  FIELDS.forEach(f=>{
    const b=document.getElementById('f-'+f.id);
    const sel=state.sel[f.id]||[];
    if(sel.length===3) done++;
    let html=`<h2>${f.title}:${f.sub?`<small>${f.sub}</small>`:''}</h2>`;
    if(sel.length){
      html+='<ul>'+sel.map(i=>`<li><span>${f.items[i][0]}</span><span>${f.items[i][1]}</span></li>`).join('')+'</ul>';
      html+= sel.length===3?'<span class="badge">✓ fertig</span>':`<span class="badge part">${sel.length} von 3</span>`;
    } else {
      html+='<span class="hint">👆 Tippe hier, um 3 Begriffe auszuwählen.</span>';
    }
    html+=`<span class="deco">${f.deco}</span>`;
    b.innerHTML=html;
    b.classList.toggle('done', sel.length===3);
    b.setAttribute('aria-label', f.title + (sel.length?': '+sel.map(i=>f.items[i][1]).join(', '):': noch nichts ausgewählt'));
  });
  document.getElementById('progress').textContent=`${done} von 8 Feldern`;
  document.getElementById('finish').classList.toggle('show', done===8);
}

/* ---------- Auswahl-Fenster ---------- */
const ov=document.getElementById('overlay');
let cur=null, tmp=[];
function openDialog(id){
  cur=FIELDS.find(f=>f.id===id);
  tmp=[...(state.sel[id]||[])];
  document.getElementById('dicon').textContent=cur.icon;
  document.getElementById('dtitle').textContent=cur.title;
  renderOpts();
  ov.classList.add('open');
  document.getElementById('dclose').focus();
}
function renderOpts(){
  const box=document.getElementById('dopts');
  box.innerHTML='';
  cur.items.forEach(([em,t,d],i)=>{
    const on=tmp.includes(i);
    const o=document.createElement('button');
    o.type='button';
    o.className='opt'+(on?' sel':'')+(!on&&tmp.length>=3?' dim':'');
    o.setAttribute('aria-pressed',on);
    o.innerHTML=`<span class="em">${em}</span><span class="txt"><div class="t">${t}</div><div class="d">${d}</div></span><span class="chk">${on?'✓':''}</span>`;
    o.addEventListener('click',()=>toggle(i));
    box.appendChild(o);
  });
  document.getElementById('dcount').textContent=`(${tmp.length} von 3 gewählt)`;
  document.getElementById('dmsg').textContent='';
}
function toggle(i){
  if(tmp.includes(i)){ tmp=tmp.filter(x=>x!==i); }
  else if(tmp.length<3){ tmp.push(i); }
  else { renderOpts(); document.getElementById('dmsg').textContent='Du hast schon 3 gewählt. Tippe erst einen Begriff an, um ihn abzuwählen.'; return; }
  renderOpts();
}
function closeDialog(saveIt){
  if(saveIt){ state.sel[cur.id]=tmp; save(); renderBoxes(); }
  ov.classList.remove('open');
  const b=document.getElementById('f-'+cur.id); if(b) b.focus();
}
document.getElementById('dok').addEventListener('click',()=>{
  if(tmp.length<3){
    document.getElementById('dmsg').textContent=`Wähle noch ${3-tmp.length} Begriff${3-tmp.length>1?'e':''} aus – oder speichere so und mach später weiter.`;
    if(!document.getElementById('dok').dataset.warned){document.getElementById('dok').dataset.warned='1';return;}
  }
  delete document.getElementById('dok').dataset.warned;
  closeDialog(true);
});
document.getElementById('dclose').addEventListener('click',()=>closeDialog(true));
ov.addEventListener('click',e=>{ if(e.target===ov) closeDialog(true); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&ov.classList.contains('open')) closeDialog(true); });

/* ---------- Zurücksetzen (mit Bestätigung im Knopf) ---------- */
const rb=document.getElementById('reset'); let armed=false, t;
rb.addEventListener('click',()=>{
  if(!armed){ armed=true; rb.textContent='Wirklich alles löschen? Nochmal tippen'; t=setTimeout(()=>{armed=false;rb.textContent='Alles zurücksetzen';},3000); return; }
  clearTimeout(t); armed=false; rb.textContent='Alles zurücksetzen';
  state={sel:{}}; nameInput.value=''; save(); renderBoxes();
});

renderBoxes();
</script>
</body>
</html>
