// ---------- game state ----------
function place(c, byPlayer) {
  c.placed = true;
  var tg = targetFor(c);
  setPos(c, tg.x, tg.y);
  setCls(c.g, "placed", true);
  setCls(c.g, "wrong", false);
  placedLayer.appendChild(c.g);
  paintCard(c);
  paintDots();
  updateScore(byPlayer);
}
function updateScore(byPlayer) {
  var n = 0;
  for (var i = 0; i < cards.length; i++) if (cards[i].placed) n++;
  scoreEl.innerHTML = n + " / " + cards.length + " richtig";
  if (n === cards.length && byPlayer) {
    var secs = Math.round((now() - (startTime || now())) / 1000),
      mm = Math.floor(secs / 60),
      ss = secs % 60;
    winEl.innerHTML = "Super! Alles richtig zugeordnet.<small>Zeit: " + mm + ":" + (ss < 10 ? "0" : "") + ss + " min &middot; Fehlversuche: " + errors + "</small>";

function newGame() {

function solve() {

  for (var j = 0; j < loose.length; j++) {

        var tg = targetFor(c);

function relayout() {

document.getElementById("tColor").addEventListener("change", function (e) {

document.getElementById("bShuffle").addEventListener("click", newGame, false);

var rt = null;
