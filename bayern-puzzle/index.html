<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle: Die Regierungsbezirke von Bayern</title>
<style>
  :root{
    --bg:#f4f1ea; --ink:#1f2a37; --muted:#5b6675; --card:#fffdf8; --line:#d9d3c6;
    --blue:#1f6fb2; --ok:#2e8b57;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  body,svg,.toggle,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:-webkit-box;display:flex;-webkit-box-orient:vertical;flex-direction:column;min-height:100vh;min-height:-webkit-fill-available}
  header{display:flex;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{font-size:clamp(17px,2.2vw,24px);margin:0;font-weight:900;letter-spacing:.2px}
  h1 small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
  .spacer{flex:1}
  .score{font-weight:800;font-size:15px;background:#eef4fa;color:var(--blue);padding:6px 12px;border-radius:999px;white-space:nowrap}
  .controls{display:flex;flex-wrap:wrap;align-items:center}
  .controls > *{margin:4px}
  header > *{margin:3px 6px}
  .toggle{display:inline-flex;align-items:center;font-weight:700;font-size:14px;cursor:pointer;user-select:none;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .toggle input{position:absolute;opacity:0;pointer-events:none}
  .sw{margin-right:8px;width:36px;height:20px;border-radius:999px;background:#c9cfd6;position:relative;transition:background .2s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
  .toggle input:checked + .sw{background:var(--blue)}
  .toggle input:checked + .sw::after{transform:translateX(16px)}
  .toggle input:focus-visible + .sw{outline:3px solid #9cc3e6;outline-offset:2px}
  button{font:inherit;font-weight:800;font-size:14px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  button:hover{background:#f7f7f7}
  button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  button.primary:hover{background:#185d96}
  main{-webkit-box-flex:1;flex:1 1 auto;position:relative;min-height:440px}
  svg#board{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;touch-action:none;-ms-touch-action:none;display:block}
  .target-fill{fill:#ffffff}
  .target-outline{fill:none;stroke:#1f2a37;stroke-width:3;stroke-linejoin:round}
  .target-inner{fill:none;stroke:#9aa3ad;stroke-width:1.2;stroke-dasharray:5 5;opacity:0;transition:opacity .25s}
  .show-borders .target-inner{opacity:1}
  .tray{fill:#ebe6db;stroke:#d4cdbd;stroke-width:1.5;stroke-dasharray:8 6}
  .tray-label{fill:#8a8272;font-size:15px;font-weight:800;letter-spacing:.5px}
  .piece{cursor:grab}
  .piece.dragging{cursor:grabbing}
  .piece path{stroke:#ffffff;stroke-width:1.6;stroke-linejoin:round}
  .piece.dragging path{filter:drop-shadow(0 8px 10px rgba(0,0,0,.28))}
  .piece:not(.placed):hover path{filter:brightness(1.06) drop-shadow(0 3px 4px rgba(0,0,0,.18))}
  .piece.placed{cursor:default}
  .piece.placed path{stroke:#ffffff;stroke-width:1.2}
  .piece.flash path{animation:flash .6s ease-out}
  @keyframes flash{0%{filter:brightness(1.5)}100%{filter:none}}
  .label{font-weight:900;fill:#1f2a37;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:4px;stroke-linejoin:round;pointer-events:none;text-anchor:middle;dominant-baseline:central;transition:opacity .2s}
  .hide-names .label{opacity:0}
  .check{pointer-events:none}
  #win{position:absolute;left:50%;top:18px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:var(--ok);color:#fff;font-weight:900;font-size:18px;padding:12px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:all .35s;text-align:center}
  #win.show{opacity:1;transform:translate(-50%,0)}
  #win small{display:block;font-weight:700;font-size:13px;opacity:.9}
  footer{font-size:12px;color:var(--muted);padding:6px 18px;background:var(--card);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Die Regierungsbezirke von Bayern<small>Ziehe jeden Bezirk an die richtige Stelle in der Bayernkarte.</small></h1>
  <div class="spacer"></div>
  <div class="score" id="score">0 / 7 richtig</div>
  <div class="controls">
    <label class="toggle"><input type="checkbox" id="tNames" checked><span class="sw"></span>Namen anzeigen</label>
    <label class="toggle"><input type="checkbox" id="tBorders"><span class="sw"></span>Hilfslinien</label>
    <button id="bShuffle" class="primary">Neu mischen</button>
    <button id="bSolve">Lösung zeigen</button>
  </div>
</header>
<main id="main">
  <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Puzzle-Fläche mit Bayernkarte und Bezirksteilen">
    <g id="trayLayer"></g>
    <g id="mapLayer"></g>
    <g id="placedLayer"></g>
    <g id="pieceLayer"></g>
  </svg>
  <div id="win" role="status" aria-live="polite"></div>
  <div id="err" style="display:none;position:absolute;left:12px;right:12px;top:12px;background:#fff3f3;border:1px solid #e0a0a0;color:#8a1f1f;padding:10px 14px;border-radius:10px;font-size:14px"></div>
</main>
<footer>Grenzdaten: deutschlandGeoJSON (isellsoap, GitHub), vereinfacht. Tipp: Mit „Hilfslinien“ werden die Bezirksgrenzen in der Karte gestrichelt angezeigt.</footer>

  var e = document.getElementById("err");
  if (e){ e.style.display="block"; e.innerHTML = "Fehler beim Laden des Puzzles: " + msg + " (Zeile " + line + ")"; }
};
